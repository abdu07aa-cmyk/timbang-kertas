    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #e0e7ff; font-family: Arial, sans-serif; padding: 12px; }
        .container { max-width: 650px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { font-size: 1.3rem; color: #1e3a8a; text-align: center; }
        h2 { font-size: 1.05rem; color: #1e3a8a; margin-bottom: 8px; }
        h3.sec { font-size: .95rem; color: #1e3a8a; margin: 4px 0 8px; }
        .tab-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tab { flex: 1; min-width: 22%; text-align: center; padding: 9px 4px; background: #cbd5e1; border-radius: 40px; font-weight: bold; cursor: pointer; font-size: .78rem; }
        .tab.active { background: #1e3a8a; color: white; }
        .page { display: none; }
        .page.active-page { display: block; }
        label { font-weight: bold; display: block; margin-top: 12px; margin-bottom: 5px; font-size: 0.85rem; }
        input, select { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #ccc; }
        input[readonly] { background: #f1f5f9; color: #334155; }
        input[type="checkbox"] { width: 20px; height: 20px; min-width: 20px; min-height: 20px; accent-color: #1e3a8a; cursor: pointer; vertical-align: middle; }
        button { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 40px; width: 100%; margin-top: 16px; cursor: pointer; font-weight: bold; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        select:disabled { background: #f1f5f9; }
        .btn-reset { background: #64748b; margin-top: 8px; }
        .btn-hapus { background: #ef4444; margin-top: 8px; }
        .btn-edit-small { background: #f59e0b; padding: 4px 8px; font-size: 0.7rem; width: auto; margin: 0; border-radius: 12px; cursor: pointer; color: white; border: none; }
        .btn-hapus-small { background: #ef4444; padding: 4px 8px; font-size: 0.7rem; width: auto; margin: 0 0 0 4px; border-radius: 12px; cursor: pointer; color: white; border: none; }
        .btn-export { background: #10b981; margin-top: 8px; }
        .btn-cetak { background: #8b5cf6; margin-top: 8px; }
        .btn-urut { background: #06b6d4; margin-top: 8px; }
        .mini { width: auto; margin: 0; padding: 6px 12px; font-size: .75rem; border-radius: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: left; vertical-align: middle; }
        th { background: #e2e8f0; }
        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
        .pagination button { width: auto; padding: 5px 10px; margin-top: 0; background: #e2e8f0; color: black; border: none; border-radius: 12px; cursor: pointer; }
        .pagination button.active-page-btn { background: #1e3a8a; color: white; }
        .search-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .search-row input { flex: 2; margin-top: 0; }
